<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Message Encoder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Audio Messaging Demo</p>
          <h1>Send text as sound</h1>
        </div>
      </header>

      <main class="panel-grid">
        <section class="panel">
          <div class="panel-header">
            <h2>Encode</h2>
            <span class="badge">Browser generated</span>
          </div>

          <label for="messageInput">Message</label>
          <textarea id="messageInput" rows="8" placeholder="Type your message here...">Hello from audio</textarea>

          <div class="controls-row">
            <div class="field">
              <label for="freqZero">Bit 0 frequency</label>
              <input id="freqZero" type="number" min="200" max="5000" value="800" />
            </div>
            <div class="field">
              <label for="freqOne">Bit 1 frequency</label>
              <input id="freqOne" type="number" min="200" max="5000" value="1400" />
            </div>
          </div>

          <div class="controls-row">
            <div class="field">
              <label for="bitDuration">Bit duration (s)</label>
              <input id="bitDuration" type="number" min="0.03" max="1" step="0.01" value="0.12" />
            </div>
            <div class="field">
              <label for="sampleRate">Sample rate</label>
              <input id="sampleRate" type="number" min="8000" max="48000" step="1000" value="22050" />
            </div>
          </div>

          <div class="button-row">
            <button id="generateBtn" class="primary">Generate audio</button>
            <a id="downloadBtn" class="secondary hidden" download="message.wav">Download WAV</a>
          </div>

          <audio id="audioPlayer" controls class="hidden"></audio>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Decode</h2>
            <span class="badge">Upload WAV</span>
          </div>

          <label for="audioUpload">Choose audio file</label>
          <input id="audioUpload" type="file" accept=".wav,audio/wav" />

          <div class="decode-status" id="decodeStatus">No file selected.</div>

          <label for="decodedText">Decoded message</label>
          <textarea id="decodedText" rows="8" readonly placeholder="Decoded text will appear here..."></textarea>

          <button id="decodeBtn" class="primary">Decode uploaded audio</button>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
